# ============================================================
# Chạy agent + redis bằng một lệnh:  docker compose up --build
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    # Đọc thêm biến từ .env; required: false để không có file .env vẫn chạy được
    env_file:
      - path: .env
        required: false
    environment:
      # Trong mạng của Compose, agent gọi Redis bằng TÊN service "redis"
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-key}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
