# Render Blueprint: agent (Docker) + Redis (Key Value).
# Secret không ghi thẳng giá trị: generateValue để Render tự sinh ngẫu nhiên.
services:
  - type: web
    name: ai-agent
    runtime: docker
    # render.yaml nằm trong thư mục con của repo → phải đặt rootDir, nếu không Render
    # sẽ build Dockerfile ở gốc repo (một app khác). dockerfilePath/dockerContext
    # được tính tương đối so với rootDir.
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: agent-redis
    plan: free
    ipAllowList: []
