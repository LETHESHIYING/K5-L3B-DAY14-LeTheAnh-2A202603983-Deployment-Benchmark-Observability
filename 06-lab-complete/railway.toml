# Cấu hình deploy Railway. Railway build từ Dockerfile và cấp cổng qua biến PORT
# (Dockerfile đã lắng nghe theo ${PORT:-8000}).
#
# Cần thêm một Redis trên Railway rồi đặt REDIS_URL của service agent trỏ tới nó,
# cùng AGENT_API_KEY: railway variables set AGENT_API_KEY=<giá-trị-bí-mật>

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
